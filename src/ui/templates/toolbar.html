<header class="lobby-toolbar">
  <nav data-i18n-aria="lobbyNav" aria-label="로비 메뉴">
    <button data-i18n="lobby" class="current" aria-current="page" data-home>
      <svg><use href="#home" /></svg>로비
    </button>
    <button data-i18n="shop" data-shop>
      <svg><use href="#shop" /></svg>상점</button
    ><button data-i18n="gear" data-wip>
      <svg><use href="#gear" /></svg>장비</button
    ><button data-i18n="profile" data-wip>
      <svg><use href="#person" /></svg>내정보</button
    ><button data-i18n="rankings" data-wip>
      <svg><use href="#cup" /></svg>랭킹
    </button>
  </nav>
  <a data-i18n="play" class="play" href="#/ready" aria-haspopup="dialog">게임시작</a>
  <div class="toolbar-utilities">
    <div data-i18n-aria="currency" class="wallet" aria-label="재화">
      <button data-i18n-aria="gold" data-wip aria-label="골드 23873, 충전">
        <i>●</i>23873 <b>+</b></button
      ><button data-i18n-aria="gems" data-wip aria-label="보석 0"><i>◆</i>0</button>
    </div>
    <button data-i18n="alerts" class="alerts" data-wip>
      <svg><use href="#chat" /></svg>알림</button
    ><button data-i18n="friends" data-wip>
      <svg><use href="#friends" /></svg>친구목록
    </button>
    <div class="tools">
      <button data-i18n-aria="settings" data-wip aria-label="설정">⚙</button
      ><button data-i18n-aria="chat" data-wip aria-label="채팅">•••</button>
    </div>
  </div>
</header>
