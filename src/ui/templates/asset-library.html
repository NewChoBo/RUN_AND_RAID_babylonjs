<section data-i18n-aria="assets" id="library" aria-label="원작 에셋" hidden>
  <header>
    <a href="#/ready"
      ><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#ui-back" /></svg
      ><span data-i18n="backToArena">경기장</span></a
    >
    <h1 data-i18n="assets">원작 에셋</h1>
    <span id="count"></span>
  </header>
  <div class="library-layout">
    <aside>
      <label data-i18n="assetGroup">캐릭터·폴더<select id="group" disabled></select></label
      ><label data-i18n="fileSearch"
        >파일 검색<input
          data-i18n-placeholder="searchExample"
          id="filter"
          type="search"
          disabled
          placeholder="예: skill4start" /></label
      ><label data-i18n="sourceFile"
        >원본 파일<select id="entries" size="14" disabled></select
      ></label>
    </aside>
    <section>
      <h2 data-i18n="loadingAsset" id="name">에셋 불러오는 중</h2>
      <p id="status" role="status"></p>
      <div id="stage">
        <canvas
          data-i18n-aria="previewCanvas"
          id="model"
          aria-label="드래그해 모델 회전, 휠 또는 두 손가락으로 확대"
        ></canvas
        ><img data-i18n-alt="assetPreview" id="picture" hidden alt="원본 에셋 미리보기" />
      </div>
      <p id="info"></p>
      <a data-i18n="openConverted" id="download" hidden download>변환 파일 열기</a>
    </section>
  </div>
</section>
