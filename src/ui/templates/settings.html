<dialog id="game-settings" class="ui-dialog" aria-labelledby="settings-heading">
  <header class="ui-dialog-header">
    <h2 id="settings-heading" data-i18n="settings">설정</h2>
    <form method="dialog">
      <button
        class="ui-icon-button"
        type="submit"
        aria-label="닫기"
        data-i18n-aria="close"
        autofocus
      >
        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="#ui-close" /></svg>
      </button>
    </form>
  </header>
  <div class="settings-body">
    <div class="settings-row">
      <span data-i18n="displayMode">화면 모드</span>
      <button type="button" id="settings-fullscreen" data-i18n="enterFullscreen">
        전체 화면으로 전환
      </button>
    </div>
    <p id="settings-status" role="status"></p>
    <div id="settings-battle"></div>
    <div class="settings-row">
      <label for="settings-language" data-i18n="language">언어</label>
      <select id="settings-language">
        <option value="ko" lang="ko">한국어</option>
        <option value="en" lang="en">English</option>
      </select>
    </div>
    <p id="settings-language-note" data-i18n="languageAfterRoom" hidden>
      로비로 돌아가면 선택한 언어가 적용됩니다.
    </p>
  </div>
</dialog>
