<section id="shop-gallery" aria-label="상점 감상실" hidden>
  <header>
    <h1>상점</h1>
    <div aria-label="감상 종류">
      <button type="button" data-mode="art" aria-pressed="true">일러스트</button
      ><button type="button" data-mode="model" aria-pressed="false">캐릭터 모델</button>
    </div>
  </header>
  <div class="gallery-body">
    <aside>
      <button type="button" id="gallery-hero">캐릭터 선택</button>
      <div id="gallery-item" aria-label="작품 · 외형" role="group"></div>
    </aside>
    <figure>
      <div class="gallery-stage">
        <img id="gallery-art" alt="" referrerpolicy="no-referrer" /><canvas
          id="gallery-model"
          aria-label="회전 및 확대 가능한 캐릭터 모델"
          hidden
        ></canvas>
      </div>
      <figcaption>
        <strong id="gallery-name"></strong><span id="gallery-status" role="status"></span>
      </figcaption>
    </figure>
  </div>
</section>
