<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#151d26" />
    <title>런앤레이드</title>
    <link rel="stylesheet" href="./src/ui/styles/shell.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0" inert aria-label="런앤레이드 경기장"></canvas>
    <section id="overlay" class="overlay" data-screen="title" aria-labelledby="title-name">
      <div class="menu-folio">
        <header class="title-copy">
          <h1 id="title-name">런앤레이드</h1>
          <a href="./library.html">원작 에셋 열기</a>
        </header>
        <div id="menu-actions" class="menu-actions">
          <button type="button" id="start">봇과 연습</button>
        </div>
        <p id="startup-progress" role="status" hidden>경기장 불러오는 중…</p>
        <p id="startup-error" role="alert" hidden></p>
      </div>
    </section>
    <dialog id="viewport-limit" aria-labelledby="viewport-heading">
      <h2 id="viewport-heading" tabindex="-1">화면 크기를 확인하세요</h2>
      <p id="viewport-instructions">가로 화면으로 돌려 주세요.</p>
      <p id="viewport-minimum"></p>
      <button id="viewport-expand" type="button" hidden>전체 화면</button
      ><button id="viewport-rotate" type="button" hidden>화면 회전</button>
      <p id="viewport-orientation-status" role="status"></p>
    </dialog>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
