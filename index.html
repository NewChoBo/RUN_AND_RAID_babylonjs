<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#191b20" />
    <title>런앤레이드 · 로비</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./src/ui/styles/home.css" />
  </head>
  <body>
    <main class="lobby">
      <header>
        <div class="brand"><img src="./favicon.ico" alt="" width="30" height="30" />런앤레이드</div>
        <nav aria-label="로비 메뉴">
          <a class="active" href="#lobby" data-page="lobby"><b aria-hidden="true">⌂</b>로비</a>
          <a href="#heroes" data-page="heroes"><b aria-hidden="true">⚔</b>주자</a>
          <a href="#controls" data-page="controls"><b aria-hidden="true">✥</b>조작법</a>
        </nav>
        <a class="play" href="./game.html">게임시작 <span aria-hidden="true">▶</span></a>
      </header>
      <section class="banner" aria-labelledby="banner-heading">
        <img class="fighter left" src="./assets/raid/portraits/hammer.webp" alt="" />
        <div class="banner-copy">
          <p>RUN &amp; RAID</p>
          <h1 id="banner-heading">런앤레이드</h1>
          <span>두 팀, 하나의 마차</span>
        </div>
        <img class="fighter right" src="./assets/raid/portraits/kaiken.webp" alt="" />
      </section>
      <section class="board" aria-labelledby="list-title">
        <div class="list">
          <h2 id="list-title">새소식</h2>
          <div id="items"></div>
        </div>
        <article aria-live="polite">
          <h2>내용</h2>
          <div class="article-body">
            <h3 id="subject"></h3>
            <p id="body"></p>
            <p id="extra"></p>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="./src/app/home.ts"></script>
  </body>
</html>
