<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#161513" />
    <title>런앤레이드 · 로비</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./src/ui/styles/shell.css" />
    <link rel="stylesheet" href="./src/ui/styles/home.css" />
    <link rel="stylesheet" href="./src/ui/styles/ready.css" />
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="home" viewBox="0 0 24 24">
        <path d="M0 11 12 1l12 10h-3v12h-7v-8h-4v8H3V11z" />
      </symbol>
      <symbol id="shop" viewBox="0 0 24 24">
        <path d="M1 7q0-4 5-3l14 3q3 1 2 4l-3 9q-1 2-4 1L4 18z" />
        <path fill="#e4dac4" d="m7 9 3 1 1-1 3 2-2 1-2-1-2 1z" />
      </symbol>
      <symbol id="gear" viewBox="0 0 24 24">
        <path
          d="m2 1 4 1 12 15 2-2 2 2-2 2 3 3-2 2-3-3-2 2-2-2 2-2L2 5zM22 1l-4 1L6 17l-2-2-2 2 2 2-3 3 2 2 3-3 2 2 2-2-2-2L22 5z"
        />
      </symbol>
      <symbol id="person" viewBox="0 0 24 24">
        <circle cx="12" cy="6" r="5" />
        <path d="M2 23v-4q1-8 10-8t10 8v4z" />
      </symbol>
      <symbol id="cup" viewBox="0 0 24 24">
        <path
          d="M5 2h14v2h4q0 9-7 10l-3 3v3l5 1v2H6v-2l5-1v-3l-3-3Q1 13 1 4h4zm0 4H3q1 5 4 5zm14 0-2 5q3 0 4-5z"
        />
      </symbol>
      <symbol id="friends" viewBox="0 0 24 24">
        <circle cx="9" cy="6" r="5" />
        <circle cx="18" cy="7" r="4" />
        <path d="M0 23v-4a9 9 0 0 1 18 0v4zm19 0v-4q0-5-3-8 8 0 8 9v3z" />
      </symbol>
      <symbol id="chat" viewBox="0 0 24 24">
        <path d="M2 2h17v13H9l-5 5v-5H2zm18 5h3v13h-3v3l-4-3H9v-3h11z" />
      </symbol>
    </svg>
    <main class="lobby" aria-label="런앤레이드 로비">
      <header class="lobby-toolbar">
        <nav aria-label="로비 메뉴">
          <button class="current" aria-current="page" data-home>
            <svg><use href="#home" /></svg>로비
          </button>
          <button data-wip>
            <svg><use href="#shop" /></svg>상점</button
          ><button data-wip>
            <svg><use href="#gear" /></svg>장비</button
          ><button data-wip>
            <svg><use href="#person" /></svg>내정보</button
          ><button data-wip>
            <svg><use href="#cup" /></svg>랭킹
          </button>
        </nav>
        <a class="play" href="#/ready">게임시작</a>
        <div class="wallet" aria-label="재화">
          <button data-wip aria-label="골드 23873, 충전"><i>●</i>23873 <b>+</b></button
          ><button data-wip aria-label="보석 0"><i>◆</i>0</button>
        </div>
        <button class="alerts" data-wip>
          <svg><use href="#chat" /></svg>알림</button
        ><button data-wip>
          <svg><use href="#friends" /></svg>친구목록
        </button>
        <div class="tools">
          <button data-wip aria-label="설정">⚙</button
          ><button data-wip aria-label="채팅">•••</button>
        </div>
      </header>
      <section class="banner">
        <img
          class="banner-art"
          alt="성문 앞에서 다시 만난 릴딘, 롱샷, 칼리"
          src="./assets/raid/lobby/returning-runners.webp"
        />
        <h1>환영합니다!</h1>
        <p>저도 그리움에 사무쳐 돌아오신 여러분들이 그리웠습니다.</p>
        <small>(팬 복각 버전입니다.)</small>
      </section>
      <section class="board">
        <div class="list">
          <h2>개발일지</h2>
          <div class="columns">구분 <span>제목</span></div>
          <div id="items"></div>
        </div>
        <article>
          <h2>내용</h2>
          <div class="article-body">
            <div class="article-title">
              <h3 id="subject"></h3>
              <button id="details">자세히 보러가기</button>
            </div>
            <p id="body" aria-live="polite"></p>
          </div>
        </article>
      </section>
      <section id="overlay" aria-labelledby="title-name" hidden>
        <div class="room-heading">
          <h1 id="title-name" tabindex="-1">경기 대기실</h1>
          <a href="#/assets">원작 에셋 열기</a>
        </div>
        <div class="room-layout">
          <section class="title-copy">
            <h2>주자 정보</h2>
            <figure id="solo-profile">
              <img alt="" width="240" height="240" />
              <figcaption>
                <strong></strong>
                <p></p>
              </figcaption>
            </figure>
          </section>
          <div id="menu-actions"><button type="button" id="start">봇과 연습</button></div>
          <p id="startup-progress" role="status" hidden>경기장 불러오는 중…</p>
          <p id="startup-error" role="alert" hidden></p>
        </div>
      </section>
      <section id="library" aria-label="원작 에셋" hidden>
        <header>
          <a href="#/ready">← 경기장</a>
          <h1>원작 에셋</h1>
          <span id="count"></span>
        </header>
        <div class="library-layout">
          <aside>
            <label>캐릭터·폴더<select id="group"></select></label
            ><label
              >파일 검색<input id="filter" type="search" placeholder="예: skill4start" /></label
            ><label>원본 파일<select id="entries" size="14"></select></label>
          </aside>
          <section>
            <h2 id="name">에셋 불러오는 중</h2>
            <p id="status" role="status"></p>
            <div id="stage">
              <canvas
                id="model"
                aria-label="드래그해 모델 회전, 휠 또는 두 손가락으로 확대"
              ></canvas
              ><img id="picture" hidden alt="원본 에셋 미리보기" />
            </div>
            <p id="info"></p>
            <a id="download" hidden download>변환 파일 열기</a>
          </section>
        </div>
      </section>
    </main>
    <canvas id="game" tabindex="0" inert aria-label="런앤레이드 경기장"></canvas>
    <dialog id="viewport-limit" aria-labelledby="viewport-heading">
      <h2 id="viewport-heading" tabindex="-1">화면 크기를 확인하세요</h2>
      <p id="viewport-instructions">가로 화면으로 돌려 주세요.</p>
      <p id="viewport-minimum"></p>
      <button id="viewport-expand" type="button" hidden>전체 화면</button
      ><button id="viewport-rotate" type="button" hidden>화면 회전</button>
      <p id="viewport-orientation-status" role="status"></p>
    </dialog>

    <section class="rotate" aria-label="가로 화면 안내">
      <span aria-hidden="true">↻</span>
      <h2>가로로 돌려 주세요</h2>
      <p>런앤레이드는 가로 화면에서 이용할 수 있습니다.</p>
    </section>
    <dialog id="message" aria-labelledby="message-text">
      <p id="message-text"></p>
      <form method="dialog"><button autofocus>확인</button></form>
    </dialog>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
