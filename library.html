<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>런앤레이드 · 원작 에셋</title>
    <link rel="stylesheet" href="./src/ui/styles/library.css" />
  </head>
  <body>
    <header>
      <a href="./">← 경기장</a>
      <h1>원작 에셋</h1>
      <span id="count"></span>
    </header>
    <main>
      <aside>
        <label>캐릭터·폴더<select id="group"></select></label
        ><label>파일 검색<input id="filter" type="search" placeholder="예: skill4start" /></label
        ><label>원본 파일<select id="entries" size="14"></select></label>
      </aside>
      <section>
        <h2 id="name">에셋 불러오는 중</h2>
        <p id="status" role="status"></p>
        <div id="stage">
          <canvas id="model" aria-label="드래그해 모델 회전, 휠 또는 두 손가락으로 확대"></canvas
          ><img id="picture" hidden alt="원본 에셋 미리보기" />
        </div>
        <p id="info"></p>
        <a id="download" hidden download>변환 파일 열기</a>
      </section>
    </main>
    <script type="module" src="./src/app/asset-library.ts"></script>
  </body>
</html>
