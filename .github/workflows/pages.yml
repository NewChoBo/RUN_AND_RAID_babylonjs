name: Publish game to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_PHOTON_APP_ID: ${{ vars.VITE_PHOTON_APP_ID }}
      - name: Verify public assets and compiled entry
        working-directory: dist
        run: |
          sha256sum --check ../.github/pages-assets.sha256
          diff -u <(cut -c67- ../.github/pages-assets.sha256 | sort) <(find . -type f -printf '%P\n' | grep -Ev '^(index|library)\.html$|^assets/[^/]+-[[:alnum:]_-]+\.(js|css)$' | sort)
          grep -Eq 'src="\./assets/[^"]+\.js"' index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
