name: Publish game to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          VITE_PHOTON_APP_ID: ${{ vars.VITE_PHOTON_APP_ID }}
      - name: Verify public assets and compiled entry
        working-directory: dist
        run: |
          sha256sum --check ../.github/pages-assets.sha256
          diff -u <(cut -c67- ../.github/pages-assets.sha256 | sort) <(find . -type f -printf '%P\n' | grep -Ev '^(index|game|library)\.html$|^assets/[^/]+-[[:alnum:]_-]+\.(js|css)$' | sort)
          grep -Eq 'src="\./assets/[^"]+\.js"' index.html
          grep -Eq 'src="\./assets/[^"]+\.js"' game.html
          for marker in 'class="symbols"' 'class="lobby-toolbar"' 'class="banner"' 'id="shop-gallery"' 'id="match-menu"' 'id="library"' 'id="game-settings"'; do
            grep -Fq "$marker" index.html
          done
      - name: Preserve model URLs used by previously deployed clients
        env:
          LEGACY_RELEASE: 7cb01b8c254877249d8954c72b186c305744dcb6
        run: |
          git fetch --depth=1 origin "$LEGACY_RELEASE"
          git archive "$LEGACY_RELEASE" public/assets/fighters | tar -x --strip-components=1 -C dist
          git show "$LEGACY_RELEASE:.github/pages-assets.sha256" | grep '  assets/fighters/' | (cd dist && sha256sum --check --quiet)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
